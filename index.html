<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#007A4F" />
    <meta
      name="description"
      content="Konektron Research: protocolo, revisões de literatura, triagem, análise e relatórios de pesquisas científicas em um só lugar."
    />
    <title>Konektron Research</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      VLibras (Governo Federal, gov.br/vlibras): tradutor de português para Libras.
      Fica fora do #root para o React não mexer nos elementos do widget; escondido quando a
      interface está traduzida para outro idioma (ver app.scss).
    -->
    <div vw class="enabled notranslate" translate="no">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script
      defer
      src="https://vlibras.gov.br/app/vlibras-plugin.js"
      onload="new window.VLibras.Widget('https://vlibras.gov.br/app')"
      onerror="console.warn('VLibras indisponível (o plugin não carregou).')"
    ></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
